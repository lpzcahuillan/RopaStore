spring.application.name=ms-ventas
server.port=8084

# H2 Database
spring.datasource.url=jdbc:h2:mem:ventasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HikariCP
spring.datasource.hikari.pool-name=HikariPool-Ventas
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# URL de Microservicio Pedidos
microservicio.pedidos.url=http://localhost:8083

# Timeouts de conexión y lectura
microservicio.timeout.connect-ms=3000
microservicio.timeout.read-ms=5000
